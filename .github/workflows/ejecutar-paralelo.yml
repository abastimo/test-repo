name: Ejecutar archivos en paralelo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dar permisos al script
        run: chmod +x scripts/ejecutar.sh

      - name: Ejecutar Bash
        run: ./scripts/ejecutar.sh